name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-klend:
    name: Build klend (solana-verify)
    runs-on: ubuntu-latest
    steps:
      - name: Install essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install solana-verify
        run: cargo install --locked solana-verify

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "build-klend"

      - name: Build with solana-verify
        run: solana-verify build

      - name: Print executable hash
        run: solana-verify get-executable-hash target/deploy/kamino_lending.so

      - name: Upload .so artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kamino-lending-so
          path: target/deploy/kamino_lending.so
          retention-days: 7

  klend-interface-tests:
    name: klend-interface tests
    needs: [build-klend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.86.0"
          components: clippy

      - name: Download .so artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kamino-lending-so
          path: target/deploy

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "klend-interface"
          workspaces: "libs/klend-interface -> target"

      - name: Run unit tests
        working-directory: libs/klend-interface
        run: cargo test --lib

      - name: Run integration tests
        working-directory: libs/klend-interface
        run: cargo test --test litesvm_integration

      - name: Clippy
        working-directory: libs/klend-interface
        run: cargo clippy --all-targets -- -D warnings

  klend-interface-fmt:
    name: klend-interface fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          components: rustfmt
          toolchain: nightly-2026-01-01

      - name: Fmt
        working-directory: libs/klend-interface
        run: cargo +nightly-2026-01-01 fmt --all -- --check
